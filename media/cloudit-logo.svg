<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <!-- Gradient for the cloud -->
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#319795;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c7a7b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for accent -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Cloud shape with IT icon integrated -->
  <g filter="url(#shadow)">
    <!-- Main cloud body -->
    <path d="M 35 45 
             Q 30 35, 40 32
             Q 45 25, 55 28
             Q 65 22, 72 30
             Q 80 28, 85 35
             Q 90 40, 85 48
             Q 90 55, 82 58
             H 40
             Q 32 55, 35 45 Z" 
          fill="url(#cloudGradient)" 
          opacity="0.9"/>
    
    <!-- Server rack icon inside cloud -->
    <g transform="translate(50, 38)">
      <!-- Server lines -->
      <rect x="0" y="0" width="20" height="3" fill="#ffffff" rx="1"/>
      <rect x="0" y="5" width="20" height="3" fill="#ffffff" rx="1"/>
      <rect x="0" y="10" width="20" height="3" fill="#ffffff" rx="1"/>
      <rect x="0" y="15" width="20" height="3" fill="#ffffff" rx="1"/>
      
      <!-- LED indicators -->
      <circle cx="3" cy="1.5" r="0.8" fill="url(#accentGradient)"/>
      <circle cx="3" cy="6.5" r="0.8" fill="url(#accentGradient)"/>
      <circle cx="3" cy="11.5" r="0.8" fill="url(#accentGradient)"/>
      <circle cx="3" cy="16.5" r="0.8" fill="url(#accentGradient)"/>
    </g>

    <!-- Connection nodes -->
    <circle cx="30" cy="45" r="2.5" fill="url(#accentGradient)" opacity="0.8"/>
    <circle cx="90" cy="42" r="2.5" fill="url(#accentGradient)" opacity="0.8"/>
    
    <!-- Connection lines -->
    <line x1="30" y1="45" x2="48" y2="45" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6"/>
    <line x1="72" y1="40" x2="90" y2="42" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Company Name -->
  <text x="110" y="48" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#1a365d">
    Cloud
    <tspan fill="#319795">IT</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="110" y="68" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#718096" letter-spacing="1">
    TECHNOLOGIES
  </text>

  <!-- Decorative element -->
  <rect x="110" y="73" width="40" height="2" fill="url(#accentGradient)" rx="1"/>
</svg>